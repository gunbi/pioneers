<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目看板 · Pioneers</title>
<style>
  :root { color-scheme:light; --ink:#18243b; --muted:#4e6077; --line:#d6dfe9; --accent:#174b87;
    font:1rem/1.6 Geist,"PingFang SC",system-ui,sans-serif; color:var(--ink); background:#f6f7fb; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; }
  .shell { display:grid; grid-template-columns:11.5rem minmax(0,1fr); max-width:1520px; margin:auto; min-height:100vh; }
  .rail { position:sticky; top:0; align-self:start; min-height:100vh; padding:1.65rem 1rem; border-right:1px solid var(--line); background:#f7f8fc; }
  .brand { color:#222d50; font-size:1.15rem; font-weight:760; padding:0 .55rem; letter-spacing:-.035em; }
  .rail nav { display:grid; gap:.25rem; margin-top:1.55rem; }
  .rail a { display:block; padding:.43rem .55rem; border-radius:.35rem; color:#435270; font-size:.88rem; text-decoration:none; }
  .rail a:hover { background:#e8ecf7; color:var(--ink); }
  .rail a[aria-current="location"] { background:#e5eafa; color:#283d80; }
  main { min-width:0; padding:clamp(1rem,3vw,2.5rem); }
  header > p:first-child { font-weight:650; }
  h1 { max-width:32ch; margin:.28rem 0 .55rem; font-size:clamp(1.65rem,3.15vw,2.5rem); line-height:1.2; letter-spacing:-.035em; overflow-wrap:anywhere; }
  h2 { margin:0; font-size:1.18rem; }
  h3 { margin:0; font-size:1rem; }
  p { margin:0; }
  .muted { color:var(--muted); font-size:.84rem; }
  #connection::before { content:""; display:inline-block; width:.4rem; height:.4rem; margin-inline-end:.38rem; border-radius:50%; background:#74809b; vertical-align:.1em; }
  #connection[data-live]::before { background:#20836c; }
  #connection[data-error]::before { background:#a45c20; }
  .overview { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin:1.05rem 0 0; padding:0; border:1px solid var(--line); border-radius:.7rem; background:#fff; overflow:hidden; }
  .overview > div { min-width:0; padding:.75rem .95rem; border-inline-start:1px solid var(--line); }
  .overview > div:first-child { border-inline-start:0; }
  .overview dt { color:var(--muted); font-size:.83rem; font-weight:650; }
  .overview dd { margin:.12rem 0 0; font-size:1.5rem; line-height:1.18; font-weight:750; font-variant-numeric:tabular-nums; }
  .overview a { color:inherit; text-decoration-thickness:1px; }
  .overview .needs-attention { background:#fff7e8; color:#75450e; }
  .overview .needs-attention dt { color:#75450e; }
  .work { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); align-items:start; gap:1rem; margin-top:1.1rem; }
  .work[data-single] { grid-template-columns:1fr; }
  .panel { min-width:0; border:1px solid var(--line); border-radius:.9rem; background:#fff; overflow:hidden; }
  .panel.history { margin-top:1rem; }
  .panel h2 { padding:.75rem 1rem; border-bottom:1px solid var(--line); }
  .list { padding:0; margin:0; list-style:none; }
  .item { padding:.8rem 1rem; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.5rem 1rem; }
  .item + .item { border-top:1px solid var(--line); }
  .item.waiting { border-inline-start:.25rem solid #ad711a; background:#fffbf2; }
  .empty { padding:.8rem 1rem; }
  .info { flex:1 1 13rem; min-width:0; overflow-wrap:anywhere; }
  .info p { margin-top:.22rem; }
  .links { display:flex; flex-wrap:wrap; align-items:center; gap:.35rem .75rem; font-size:.84rem; }
  .list a { font-size:.87rem; }
  a { color:var(--accent); font-weight:650; text-underline-offset:.19em; }
  a:focus-visible { outline:2px solid #435fa3; outline-offset:3px; }
  .status { background:#e2eaf3; padding:.12rem .55rem; border-radius:1rem; white-space:nowrap; }
  .status.delivered { color:#226050; background:#dcefe9; }
  .status.attention { color:#71440a; background:#f9ecd0; }
  [data-error] { color:#8a341d; }
  @media (max-width:1220px) {
    .shell { display:block; }
    .rail { position:static; min-height:0; border:0; border-bottom:1px solid var(--line); display:flex; align-items:baseline; flex-wrap:wrap; gap:.25rem 1rem; padding:.65rem clamp(.55rem,2vw,1.5rem); }
    .rail nav { display:flex; flex-wrap:wrap; gap:.12rem .25rem; margin:0; }
  }
  @media (max-width:760px) {
    .work { grid-template-columns:1fr; }
    .overview > div { padding:.65rem; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <p class="brand">Pioneers</p>
    <nav id="project-nav" aria-label="项目看板导航">
      <a href="#project-overview" aria-current="location">项目概览</a>
      <a href="#pending-title">待人工确认</a>
      <a href="#current-title">当前迭代</a>
      <a href="#history-title">历史迭代</a>
    </nav>
  </aside>
  <main id="project-overview">
    <header>
      <p class="muted">项目看板</p>
      <h1 id="project" tabindex="-1">项目迭代</h1>
      <p class="muted" id="connection" role="status">正在连接</p>
      <dl id="overview" class="overview" aria-label="项目迭代概览" hidden>
        <div id="pending-metric"><dt>待人工确认</dt><dd><a id="pending-count" href="#pending-title"></a></dd></div>
        <div><dt>当前迭代</dt><dd><a id="current-count" href="#current-title"></a></dd></div>
        <div><dt>历史迭代</dt><dd><a id="history-count" href="#history-title"></a></dd></div>
      </dl>
    </header>
    <div id="project-work" class="work">
      <section class="panel" aria-labelledby="pending-title">
        <h2 id="pending-title" tabindex="-1">待人工确认</h2>
        <ul class="list" id="pending"></ul>
      </section>
      <section class="panel" aria-labelledby="current-title">
        <h2 id="current-title" tabindex="-1">当前迭代</h2>
        <ul class="list" id="current"></ul>
      </section>
    </div>
    <section class="panel history" aria-labelledby="history-title">
      <h2 id="history-title" tabindex="-1">历史迭代</h2>
      <ul class="list" id="history"></ul>
    </section>
  </main>
</div>
<script>
  const labels = {running:"进行中", completed:"已完成", failed:"失败", interrupted:"已中断",
    blocked:"已阻塞", planned:"已生成计划", accepted:"验收通过", publishing:"发布中",
    published:"已发布", publish_failed:"发布失败"};
  const byId = id => document.getElementById(id);
  const overviewView = "#project-overview";
  const sectionViews = ["#pending-title", "#current-title", "#history-title"];
  function showView(moveFocus = false) {
    const view = sectionViews.includes(location.hash) ? location.hash : overviewView;
    const overview = view === overviewView;
    for (const section of sectionViews) {
      byId(section.slice(1)).closest("section").hidden = !overview && view !== section;
    }
    const work = byId("project-work");
    work.hidden = view === "#history-title";
    work.toggleAttribute("data-single", !overview);
    for (const link of byId("project-nav").querySelectorAll("a")) {
      if (link.getAttribute("href") === view) link.setAttribute("aria-current", "location");
      else link.removeAttribute("aria-current");
    }
    if (moveFocus) {
      byId(overview ? "project" : view.slice(1)).focus({preventScroll:true});
      window.scrollTo(0, 0);
    }
  }
  showView();
  window.addEventListener("hashchange", () => showView(true));
  function element(tag, value, className) {
    const node = document.createElement(tag);
    if (value) node.textContent = value;
    if (className) node.className = className;
    return node;
  }
  function link(label, href) {
    const node = element("a", label);
    node.href = href;
    return node;
  }
  function runUrl(id) {
    return "runs/" + encodeURIComponent(id) + "/";
  }
  function localTime(raw) {
    if (!raw) return "";
    const date = new Date(raw.replace(/^(\d{4}-\d{2}-\d{2}) (\d\d:\d\d:\d\d) UTC$/, "$1T$2Z"));
    return Number.isNaN(date.getTime()) ? raw : date.toLocaleString("zh-CN", {hour12:false});
  }
  function renderRun(run) {
    const node = element("li", "", "item");
    const info = element("div", "", "info");
    const count = Object.values(run.counts).reduce((sum, value) => sum + value, 0);
    const detail = [(run.counts.completed || 0) + " / " + count + " 项任务完成", localTime(run.updated_at)];
    info.append(element("h3", run.goal), element("p", detail.filter(Boolean).join(" · "), "muted"));
    const links = element("div", "", "links");
    const tone = run.paused ? " attention" : run.has_summary ? " delivered" : "";
    links.append(element("span", run.paused ? "新任务已暂停" : labels[run.state] || run.state, "status" + tone),
      link("运行看板", runUrl(run.id)));
    if (run.counts.recovery_required) {
      const recovery = link(run.counts.recovery_required + " 项待恢复", runUrl(run.id) + "#dispatch-title");
      recovery.className = "status attention";
      links.append(recovery);
    }
    if (run.has_summary) links.append(link("迭代摘要", runUrl(run.id) + "#iteration-summary"));
    node.append(info, links);
    return node;
  }
  function renderPending(item) {
    const node = element("li", "", "item waiting");
    const info = element("div", "", "info");
    info.append(element("h3", item.goal), element("p", [item.task || "发布", item.id, item.reason].join(" · "), "muted"));
    node.append(info, link("查看并处理", runUrl(item.run) + "?decision=" + encodeURIComponent(item.id) + "#human-title"));
    return node;
  }
  function renderList(id, records, render, empty) {
    const list = byId(id);
    if (list.contains(document.activeElement) && document.activeElement.tagName === "A") {
      const currentHref = document.activeElement.getAttribute("href");
      list.replaceChildren(...records.map(render));
      Array.from(list.querySelectorAll("a")).find(item => item.getAttribute("href") === currentHref)?.focus();
    } else {
      list.replaceChildren(...records.map(render));
    }
    if (!records.length) list.append(element("li", empty, "muted empty"));
  }
  let previous;
  async function refresh() {
    const connection = byId("connection");
    try {
      const response = await fetch("project-data.json", {cache:"no-store"});
      if (!response.ok) throw new Error("Project data unavailable");
      const snapshot = await response.text();
      if (snapshot !== previous) {
        const data = JSON.parse(snapshot);
        byId("project").textContent = data.project;
        const current = data.runs.filter(run => run.active);
        const history = data.runs.filter(run => !run.active);
        byId("pending-metric").classList.toggle("needs-attention", data.pending.length > 0);
        byId("pending-count").textContent = data.pending.length;
        byId("current-count").textContent = current.length;
        byId("history-count").textContent = history.length;
        byId("overview").hidden = false;
        renderList("pending", data.pending, renderPending, "暂无待人工确认事项");
        renderList("current", current, renderRun, "暂无进行中的迭代");
        renderList("history", history, renderRun, "暂无历史迭代");
        previous = snapshot;
      }
      if (connection.textContent !== "实时更新") connection.textContent = "实时更新";
      connection.setAttribute("data-live", "");
      connection.removeAttribute("data-error");
    } catch {
      connection.textContent = "暂未连接，正在重试";
      connection.removeAttribute("data-live");
      connection.setAttribute("data-error", "");
    } finally {
      setTimeout(refresh, 2000);
    }
  }
  refresh();
</script>
</body>
</html>
